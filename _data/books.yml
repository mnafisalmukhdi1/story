#Romansa
- title: "Kesederhanaan Cinta"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/kc.jpg"
  url: "/kesederhanaan-cinta/"
  description: "Kesederhanaan Cinta adalah cerita bersambung dengan genre fiksi remaja islami yang mengandung unsur drama dan percintaan. Novel ini bercerita tentang Fida Nurhalisa sebagai gadis berusia 18 tahun menghadapi nasibnya yang kurang mampu, bertemu dengan Munajat Ali, mantan berandalan yang menyatakan cinta kepadanya karena Fida merubah hidupnya menjadi lebih baik namun Fida lebih memilih Fiqri Jayyid, temannya dari TK yang telah banyak berbuat baik kepadanya."
  category: "Romansa"

- title: "Hati Yang Terbelah"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/hyt.png"
  url: "/hati-yang-terbelah/"
  description: "Mira adalah seorang aparat kepolisian yang bekerja di Satuan Reserse Narkoba. Karirnya sontak berubah setelah dia menangkap seorang yang tidak bersalah, Amin dalam sebuah kasus yang dia tangani. Dia melakukannya untuk menunjukkan diri di hadapan Rian, rekan kerjanya untuk mendapatkan rasa kagum dan bukan itu yang sepenuhnya dia dapat. Namun karena itu, Amin dapat kembali bertemu dengan Rangga, sahabatnya selama sekolah setelah tidak bertemu sekian lama meski harus terpisah dari keluarganya. Selama di penjara, Amin berusaha membuat Rangga kembali menjadi diri yang dia kenal sebelumnya."
  category: "Romansa"

#Fantasi
- title: "Pria Bertopeng dari Surga"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/pbds.jpg"
  url: "/pria-bertopeng-dari-surga/"
  description: "Pria Bertopeng dari Surga bercerita tentang negara air dan negara api. Negara api adalah negara paling di benci oleh negara-negara lain namun negara air selalu membantunya, saat negara api telah bangkit dan lebih hebat negara api malah menyerang negara air dan hal tersebut telah diramal kan di sebuah kitab kuno. Di kitab tersebut tertulis bahwa negara api hanya bisa dikalahkan oleh pria bertopeng dari surga. Dikerahkanlah semua orang untuk mencarinya."
  category: "Fantasi"

- title: "The Masked Man from Heaven"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/tmfh.png"
  url: "/the-masked-man-from-heaven/"
  description: "relates the narrative of water and fire nation. Other countries despise the fire country, but the water nation has always aided him, especially when the fire nation has grown stronger and the more powerful fire nation attacks the water nation, as promised in an ancient text. The fire country could only be defeated by a masked man from heaven, according to the book. Everyone was dispatched to find him."
  category: "Fantasi"

- title: "Sang Penyampai Pesan"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/spp-new.png"
