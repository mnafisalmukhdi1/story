- title: "Sandiwara Hikayat"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/sh.png"
  url: "/sandiwara-hikayat/"
  description: "Sandiwara Hikayat menceritakan tentang seorang raja nan bijaksana bernama Sultan Amrullah dan kehidupannya. Hidup dalam keraton dengan Mangkubumi yang setia. Beristri dengan Nyai Ratu Amirah yang cantik jelita, dijaga dan dirawat oleh Dayang rupawan. Dengan kedua anak mereka yang diperdebatkan bahwa siapa yang akan menjadi pangeran, dan kompeni yang datang dengan mengaku hanya untuk berdagang."
  category: "Banjar"

