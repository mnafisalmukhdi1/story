- title: "86: The Drama"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/86-drama.png"
  url: "/86-the-drama/"
  description: "86: The Drama merupakan sempalan (spin-off) dari Detektif Sekolahan dengan tokoh utama kepolisian yang telah disebutkan pada cerita sebelumnya, yakni Sukamawar, Kebun Melati dan Pasir Putih. Bercerita tentang berbagai perwira dari satuan tugas kepolisian resor kota yang berbeda pula menghadapi kasus yang sesuai dengan tugas mereka."
  category: "Misteri-Thriller"

- title: "Enam Tanda Tanya"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/ett.png"
  url: "/enam-tanda-tanya/"
  description: "Enam Tanda Tanya merupakan sempalan (spin-off) dari Detektif Sekolahan dengan tokoh utama yang telah disebutkan sebelumnya, gadis kecil bernama Lily. Bercerita tentang Lily yang menghadapi berbagai kasus di sekitarnya, seperti menghilangnya semua teman sampai kematian orang-orang tersayang. Pelakunya adalah seorang pria yang menamai dirinya Sang Penanya. Fakta menyakitkan harus ditelan oleh Lily, ketika dia tahu siapa Sang Penanya sebenarnya."
  category: "Misteri-Thriller"

- title: "IF"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/if.jpg"
  url: "/if/"
  description: "Dua karakter utama dari Detektif Sekolahan kembali bersatu! Kali ini mereka berusaha mencari satu orang yang terkait dengan kehidupan mereka sejak dulu. Sementara itu, mereka juga kembali menghadapi berbagai kasus dan mencoba memecahkannya. Akankah mereka bisa melanjutkannya?"
  category: "Misteri-Thriller"

- title: "The Last Codes"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/tlc.png"
