- title: "The Masked Man from Heaven"
  cover: "https://mnafisalmukhdi1.github.io/cdn/works/tmfh.png"
  url: "/the-masked-man-from-heaven/"
  description: "The Masked Man from Heaven relates the narrative of water and fire nation. Other countries despise the fire country, but the water nation has always aided him, especially when the fire nation has grown stronger and the more powerful fire nation attacks the water nation, as promised in an ancient text. The fire country could only be defeated by a masked man from heaven, according to the book. Everyone was dispatched to find him."
  category: "Fantasi"
  chapters:
    - title: "Part 1"
