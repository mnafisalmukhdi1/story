---
layout: default
comments: true
---
<header x-show="!open" class="flex justify-between w-full bg-gray-200 p-4 sticky top-0 dark:bg-slate-800">
    {% if page.previous %}
    <div class="flex items-center"><a href="{{page.previous}}" class="text-xl dark:text-white"><span class="material-icons">arrow_back</span></a></div>
    {% endif %}
    <div class="flex flex-col items-center">
        <h1 class="block text-center text-xl">
            <a href="index.html" class="font-bold underline dark:text-white">{{page.book_title}}</a>
        </h1>
        <h2 class="block text-center">
          <select title="Pilih bab" id="chapterSelect" class="text-center bg-gray-200 dark:bg-slate-800 dark:text-white w-full sm:w-screen-sm" onchange="navigateToLink()">
            {% assign current_book = site.data.books | where: "url", page.book_url | first %}
            <option value="{{current_book.url}}index.html" class="text-base dark:text-white">{{current_book.title}}</option>
            {% for chapter in current_book.chapters %}
            {% assign chapter_url = current_book.url | append: chapter.url %}
              <option value="{{ chapter.url }}" class="text-base dark:text-white" {% if page.url == chapter_url %}selected{% endif %}>
                {{ chapter.title }}
              </option>
            {% endfor %}
          </select>      
        </h2>
    </div>
    {% if page.next %}
    <div class="flex text-right items-center"><a href="{{page.next}}" class="text-xl dark:text-white"><span class="material-icons">arrow_forward</span></a></div>
    {% endif %}
</header>
<main id="top">
<article x-show="!open" class="chapter-content p-4 space-y-4 dark:text-white">
    {{ content }}
</article>
<section x-show="open">
    <div class="flex w-full bg-gray-200 p-4 sticky top-0 dark:bg-slate-800 dark:text-white gap-2">
      <div class="flex flex-col">
        <button @click="open = false"><span class="text-sm material-icons">arrow_back_ios</span></button>
      </div>
      <div class="flex flex-col">Komentar</div>
    </div>
    <div id="disqus_thread"></div>
</section>
</main>

<footer x-show="!open" class="flex justify-between w-full bg-gray-200 p-2 sticky bottom-0 dark:bg-slate-800">
  <div class="flex flex-col items-center">
    <button @click="open = true" class="bg-gray-300 dark:bg-slate-900 p-1.5 rounded-lg shadow-lg dark:text-white hover:opacity-50"><span class="text-sm material-icons">comment</span></button>
  </div>
  <div class="flex flex-col items-center">
    <a href="https://trakteer.id/mnafisalmukhdi1/tip" target="_blank" class="hover:opacity-50"><img src="https://trakteer-assets.sgp1.digitaloceanspaces.com/images/mix/trakteer-icon.png" alt="Trakteer" class="w-10 h-10 items-center"></a>
  </div>
  <div class="flex flex-col items-center">
    <a href="#top" class="bg-gray-300 p-1.5 rounded-lg shadow-lg dark:bg-slate-900 dark:text-white hover:opacity-50"><span class="text-sm material-icons">arrow_upward</span></a>
  </div>
