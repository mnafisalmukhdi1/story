---
layout: default
---
<header class="flex justify-between w-full bg-gray-200 p-4 sticky top-0 dark:bg-slate-800">
    {% if page.previous %}
    <div class="flex items-center"><a href="{{page.previous}}" class="text-xl dark:text-white"><span class="material-icons">arrow_back</span></a></div>
    {% endif %}
    <div class="flex flex-col items-center">
        <h1 class="block text-center text-xl">
            <a href="index.html" class="font-bold underline dark:text-white">{{page.book_title}}</a>
        </h1>
        <h2 class="block text-center">
          <select id="chapterSelect" class="text-center bg-gray-200 dark:bg-slate-800 dark:text-white w-full sm:w-screen-sm" onchange="navigateToLink()">
            {% assign current_book = site.data.books | where: "url", page.book_url | first %}
            <option value="{{current_book.url}}index.html" class="text-base dark:text-white">{{current_book.title}}</option>
            {% for chapter in current_book.chapters %}
            {% assign chapter_url = current_book.url | append: chapter.url %}
              <option value="{{ chapter.url }}" class="text-base dark:text-white" {% if page.url == chapter_url %}selected{% endif %}>
                {{ chapter.title }}
              </option>
            {% endfor %}
          </select>      
        </h2>
    </div>
    {% if page.next %}
    <div class="flex text-right items-center"><a href="{{page.next}}" class="text-xl dark:text-white"><span class="material-icons">arrow_forward</span></a></div>
    {% endif %}
</header>
<main id="top" class="chapter-content p-4 justify-center space-y-4 dark:text-white">
{{ content }}
<div id="disqus_thread"></div>
</div>
<script>
    var disqus_config = function () {
    this.page.url = window.location.href;  // Replace PAGE_URL with your page's canonical URL variable
    this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
    };
    (function() { // DON'T EDIT BELOW THIS LINE
    var d = document, s = d.createElement('script');
    s.src = 'https://mnafisam.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
    })();
</script>
<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</main>
<footer>
  <a href="#top" class="fixed bottom-16 right-4 bg-gray-200 p-3.5 rounded-lg shadow-lg dark:bg-slate-800 dark:text-white opacity-50 hover:opacity-100"><span class="text-sm material-icons">arrow_upward</span></span></a>
  <a href="https://trakteer.id/mnafisalmukhdi1/tip" target="_blank" class="fixed bottom-4 right-4 opacity-50 hover:opacity-100"><img src="https://trakteer-assets.sgp1.digitaloceanspaces.com/images/mix/trakteer-icon.png" class="w-10 h-10"></a>
</footer>
