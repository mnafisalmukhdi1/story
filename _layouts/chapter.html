---
layout: default
comments: true
---
<header x-show="!open" class="sticky top-0 z-10 border-b border-gray-100 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-900/90">
  <div class="mx-auto flex h-14 max-w-3xl items-center justify-between gap-4 px-4">
    {% if page.previous %}
    <a href="{{page.previous}}" aria-label="Bab sebelumnya" class="flex shrink-0 items-center text-gray-500 transition-opacity hover:opacity-60 dark:text-slate-400"><span class="material-icons text-xl">arrow_back</span></a>
    {% else %}
    <span class="w-10 shrink-0"></span>
    {% endif %}
    <div class="flex min-w-0 flex-col items-center">
      <h1 class="block max-w-full truncate text-center text-sm font-medium dark:text-white">
        <a href="index.html" class="transition-opacity hover:opacity-70">{{page.book_title}}</a>
      </h1>
      <select title="Pilih bab" id="chapterSelect" onchange="navigateToLink()" class="mt-0.5 w-full max-w-xs cursor-pointer appearance-none border-none bg-transparent text-center text-xs text-gray-500 focus:outline-none dark:bg-transparent dark:text-slate-400">
        {% assign current_book = site.data.books | where: "url", page.book_url | first %}
        <option value="{{current_book.url}}index.html" class="text-base dark:text-white">{{current_book.title}}</option>
        {% for chapter in current_book.chapters %}
        {% assign chapter_url = current_book.url | append: chapter.url %}
          <option value="{{ chapter.url }}" class="text-base dark:text-white" {% if page.url == chapter_url %}selected{% endif %}>
            {{ chapter.title }}
          </option>
          {% endfor %}
      </select>
    </div>
    {% if page.next %}
    <a href="{{page.next}}" aria-label="Bab berikutnya" class="flex shrink-0 items-center text-gray-500 transition-opacity hover:opacity-60 dark:text-slate-400"><span class="material-icons text-xl">arrow_forward</span></a>
    {% else %}
    <span class="w-10 shrink-0"></span>
    {% endif %}
  </div>
</header>
<main id="top">
<article x-show="!open" class="chapter-content mx-auto max-w-2xl space-y-7 px-5 py-10 leading-relaxed text-gray-800 dark:text-slate-200">
    {{ content }}
</article>
<section x-show="open">
    <div class="sticky top-0 flex items-center gap-3 border-b border-gray-100 bg-white px-4 py-3 dark:border-slate-800 dark:bg-slate-900">
      <button @click="open = false" aria-label="Tutup komentar" class="text-gray-500 transition-opacity hover:opacity-60 dark:text-slate-400"><span class="material-icons text-lg">arrow_back_ios</span></button>
      <span class="text-sm font-medium dark:text-white">Komentar</span>
    </div>
    <div class="mx-auto max-w-2xl px-4 py-6">
      <div id="disqus_thread"></div>
    </div>
</section>
</main>
<script>
    /**
    *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
    *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
    var disqus_config = function () {
      this.page.url = "{{ site.url }}{{ page.url }}";
      this.page.identifier = "{{ page.url }}";
    };
    (function() { // DON'T EDIT BELOW THIS LINE
    var d = document, s = d.createElement('script');
    s.src = 'https://mnafisam.disqus.com/embed.js';
    s.setAttribute('data-timestamp', +new Date());
    (d.head || d.body).appendChild(s);
    })();
</script>
<noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
<footer x-show="!open" class="fixed bottom-0 right-0 z-10 p-4">
  <div class="flex items-center gap-2">
    <a href="https://trakteer.id/mnafisalmukhdi1/tip" target="_blank" aria-label="Trakteer" class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-100 bg-white shadow-sm transition-opacity hover:opacity-70 dark:border-slate-800 dark:bg-slate-800"><img src="https://trakteer-assets.sgp1.digitaloceanspaces.com/images/mix/trakteer-icon.png" alt="Trakteer" class="h-5 w-5 object-contain"></a>
    <button @click="open = true" aria-label="Buka komentar" class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-100 bg-white text-gray-600 shadow-sm transition-colors hover:bg-gray-50 dark:border-slate-800 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"><span class="material-icons text-lg">comment</span></button>
    <a href="#top" aria-label="Kembali ke atas" class="flex h-10 w-10 items-center justify-center rounded-full border border-gray-100 bg-white text-gray-600 shadow-sm transition-colors hover:bg-gray-50 dark:border-slate-800 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"><span class="material-icons text-lg">arrow_upward</span></a>
  </div>
</footer>
