---
layout: default
---
<header class="flex justify-between w-full bg-gray-200 p-4 sticky top-0 dark:bg-slate-800">
    {% if page.previous %}
    <div class="flex items-center"><a href="{{page.previous}}" class="text-xl dark:text-white">←</a></div>
    {% endif %}
    <div class="flex flex-col items-center">
        <h1 class="block text-center text-xl">
            <a href="index.html" class="font-bold underline dark:text-white">{{page.book_title}}</a>
        </h1>
        <h2 class="block text-center">
          <select id="chapterSelect" class="text-center bg-gray-200 dark:bg-slate-800 dark:text-white w-full sm:w-screen-sm" onchange="navigateToLink()">
            {% assign current_book = site.data.books | where: "url", page.book_url | first %}
            <option value="{{current_book.url}}index.html" class="text-base dark:text-white">{{current_book.title}}</option>
            {% for chapter in current_book.chapters %}
            {% assign chapter_url = current_book.url | append: chapter.url %}
              <option value="{{ chapter.url }}" class="text-base dark:text-white" {% if page.url == chapter_url %}selected{% endif %}>
                {{ chapter.title }}
              </option>
            {% endfor %}
          </select>      
        </h2>
    </div>
    {% if page.next %}
    <div class="flex text-right items-center"><a href="{{page.next}}" class="text-xl dark:text-white">→</a></div>
    {% endif %}
</header>
<main id="top" class="chapter-content p-4 justify-center space-y-4 dark:text-white">
{{ content }}
</main>
<footer class="flex sticky bottom-0">
    <div class="flex flex-col align-center">
      <i id="chapter1-heart" class="material-icons" onclick="toggleLike('chapter1')">favorite_border</i><br>
      <span id="chapter1-likes">0</span>
    </div>
</footer>
<script>
  // Initialize Firestore
  var db = firebase.firestore();
  // Add Votes
  function addLike(chapterId) {
    var chapterRef = db.collection("likes").doc(chapterId);

    return db.runTransaction(function(transaction) {
      return transaction.get(chapterRef).then(function(doc) {
        if (!doc.exists) {
          transaction.set(chapterRef, { count: 1 });
        } else {
          var newCount = doc.data().count + 1;
          transaction.update(chapterRef, { count: newCount });
        }
      });
    }).then(function() {
      console.log("Like successfully added!");
    }).catch(function(error) {
      console.error("Error adding like: ", error);
    });
  }
  // Show Votes
  function displayLikes(chapterId) {
    var chapterRef = db.collection("likes").doc(chapterId);

    chapterRef.onSnapshot(function(doc) {
      if (doc.exists) {
        document.getElementById(chapterId + "-likes").innerText = doc.data().count;
      } else {
        document.getElementById(chapterId + "-likes").innerText = 0;
      }
    });
  }
</script>
